name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The suite drives the graph with the deterministic planner and mock models; no torch needed.
      - run: pip install -e ".[dev]"
      - run: pytest -q
